[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "osmnx>=2.1.1",
    "pillow>=12.3.0",
    "pyproj>=3.8.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
]

[dependency-groups]
cover = [
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]
