<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback from players</title>
<style>
:root{color-scheme:light dark;
  --bg:#f3f1ec;--panel:#fbfaf7;--card:#fff;--ink:#1f1d1a;--dim:#6f6a60;--faint:#a39d90;--line:#e4dfd3;--hover:#f0ede5;--sel:#fff3d6;--selline:#e0b44a;
  --new:#d9822b;--progress:#3a7bd5;--done:#2f9e63;--wontdo:#8b8579;--bad:#b3261e;--accent:#1f1d1a;--onaccent:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#161513;--panel:#1d1c19;--card:#262421;--ink:#efece5;--dim:#a29c90;--faint:#6f6a60;--line:#34322c;--hover:#2b2926;--sel:#3a3118;--selline:#c99a2e;
  --new:#f0a04b;--progress:#6aa3f0;--done:#52c488;--wontdo:#9a9488;--bad:#f2867f;--accent:#efece5;--onaccent:#161513;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--progress);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:1rem;padding:.7rem 1.1rem;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:1.05rem;margin:0;font-weight:650;letter-spacing:-.01em}
.top .sub{color:var(--dim);font-size:.85rem}
.search{position:relative;flex:1;min-width:12rem;max-width:26rem;margin-left:auto}
.search input{width:100%;padding:.5rem .8rem .5rem 2.1rem;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.search svg{position:absolute;left:.7rem;top:50%;translate:0 -50%;width:1rem;height:1rem;color:var(--faint);pointer-events:none}
.search kbd{position:absolute;right:.6rem;top:50%;translate:0 -50%}
kbd{font:.72rem ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35rem;color:var(--dim);background:var(--panel)}
.sampleflag{background:var(--sel);border:1px solid var(--selline);border-radius:8px;padding:.15rem .6rem;font-size:.8rem}

/* filters */
.bar{display:flex;gap:.5rem;align-items:center;padding:.6rem 1.1rem;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tabs{display:flex;gap:.3rem}
.tab{border:1px solid transparent;border-radius:999px;background:none;padding:.28rem .8rem;white-space:nowrap;color:var(--dim)}
.tab:hover{background:var(--hover)}
.tab[aria-pressed=true]{background:var(--accent);color:var(--onaccent)}
.tab .n{opacity:.7;margin-left:.3rem;font-size:.85em}
.bar .gap{flex:1}
.bar select{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:.28rem .5rem;font-size:.88rem}

/* layout */
.split{flex:1;display:grid;grid-template-columns:minmax(18rem,26rem) 1fr;min-height:0}
.list{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
.day{position:sticky;top:0;z-index:1;background:var(--panel);color:var(--faint);font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:.7rem 1.1rem .3rem}
.item{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:none;padding:.65rem 1.1rem .65rem .9rem;border-bottom:1px solid var(--line)}
.item:hover{background:var(--hover)}
.item[aria-current=true]{background:var(--sel);border-left-color:var(--selline)}
.item .row{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--dim)}
.item .who{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .when{margin-left:auto;white-space:nowrap}
.item .text{margin:.2rem 0 0 1.05rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);word-break:break-word}
.item.settled .text{color:var(--dim)}
.dot{width:.62rem;height:.62rem;border-radius:50%;flex:none;background:var(--c)}
.dot[data-s=new]{--c:var(--new)}.dot[data-s=progress]{--c:var(--progress)}.dot[data-s=done]{--c:var(--done)}.dot[data-s=wontdo]{--c:var(--wontdo)}
.tick{color:var(--done);font-size:.78rem}
.lang{font-size:.68rem;font-weight:700;letter-spacing:.05em;border:1px solid var(--line);border-radius:4px;padding:0 .3rem;color:var(--dim)}
.empty{padding:3rem 1.5rem;text-align:center;color:var(--dim)}
.empty b{display:block;font-size:1.05rem;color:var(--ink);margin-bottom:.3rem}

/* detail */
.detail{overflow-y:auto;padding:1.5rem 1.5rem 4rem}
.sheet{max-width:44rem;margin:0 auto}
.back{display:none;border:0;background:none;color:var(--dim);padding:.2rem 0;margin-bottom:.8rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .9rem;align-items:center;color:var(--dim);font-size:.88rem}
.meta a{color:var(--progress)}
.message{margin:.9rem 0 1.2rem;font-size:1.2rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;letter-spacing:-.005em}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.3rem}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.12rem .7rem;font-size:.8rem;color:var(--dim)}
.shotbox{display:block;margin:0 0 1.3rem;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.shot{display:block;width:100%;height:auto;max-height:26rem;object-fit:contain;min-height:6rem}
.scenario{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;font-size:.8rem;color:var(--ink);overflow-x:auto;white-space:pre}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.card h2{margin:0 0 .6rem;font-size:.74rem;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.seg button{display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.55rem .4rem;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.9rem;white-space:nowrap}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));font-weight:600}
.seg kbd{margin-left:.15rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.9rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:.5rem .9rem;text-decoration:none;color:var(--ink);font-size:.9rem}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
.btn[aria-pressed=true]{border-color:var(--done);background:color-mix(in srgb,var(--done) 14%,var(--card))}
.btn[disabled]{opacity:.45;pointer-events:none}
textarea{width:100%;min-height:5rem;resize:vertical;padding:.65rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.state{font-size:.8rem;color:var(--faint);margin-top:.4rem;min-height:1.2em}.state.bad{color:var(--bad)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.25rem 1.2rem;margin:0;font-size:.88rem}
dt{color:var(--dim)}dd{margin:0;word-break:break-word}
details summary{cursor:pointer;color:var(--dim);font-size:.82rem;margin-top:.7rem}
pre{white-space:pre-wrap;font-size:.8rem;color:var(--dim);margin:.4rem 0 0}
.none{display:grid;place-items:center;height:100%;color:var(--faint);text-align:center}

/* toast and banner */
.toast{position:fixed;left:50%;bottom:1.4rem;translate:-50% 0;background:var(--accent);color:var(--onaccent);padding:.6rem 1rem;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:.9rem;align-items:center;z-index:5}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;padding:0}
.toast[hidden]{display:none}
#banner{margin:0;padding:.6rem 1.1rem;background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad)}
#banner[hidden]{display:none}

@media(max-width:760px){
  .split{grid-template-columns:1fr}
  .detail{display:none;padding:1rem 1rem 4rem}
  body.reading .list{display:none}
  body.reading .detail{display:block}
  .back{display:inline-block}
  .search kbd{display:none}
  .seg{grid-template-columns:1fr 1fr}
  .seg kbd,.btn kbd{display:none}
}
</style>
<div class="top">
  <h1>Feedback from players</h1><span class="sub" id="count"></span><span class="sampleflag" id="sample" hidden>Sample messages: changes are not kept</span>
  <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
    <input id="q" type="search" placeholder="Search messages, emails and notes" aria-label="Search" autofocus><kbd>/</kbd></label>
</div>
<p id="banner" hidden></p>
<div class="bar"><div class="tabs" id="tabs"></div><span class="gap"></span>
  <select id="lang" aria-label="Language"></select>
  <select id="order" aria-label="Order"><option value="new">Newest first</option><option value="old">Oldest first</option></select></div>
<div class="split"><div class="list" id="list"></div><div class="detail" id="detail"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
const STATUS={new:'New',progress:'In progress',done:'Done',wontdo:"Won't do"};
const KEYS=Object.keys(STATUS);
const TABS=[['attention','Needs attention'],...Object.entries(STATUS),['all','All']];
const LANGS={cs:'Czech',en:'English'};
const $=(id)=>document.getElementById(id);
let messages=[],state={},tab='attention',query='',lang='',order='new',selected=null,toastTimer;

const entry=(k)=>({status:'new',note:'',replied:false,...state[k]});
const inTab=(t,m)=>{const s=entry(m.key).status;return t==='all'||(t==='attention'?s==='new'||s==='progress':s===t)};
const inLang=(m)=>!lang||(m.lang||'')===lang;
const inQuery=(m)=>!query||[m.message,m.email,m.context,entry(m.key).note].join('\n').toLowerCase().includes(query);
const shown=()=>messages.filter(m=>inTab(tab,m)&&inLang(m)&&inQuery(m)).sort((a,b)=>(order==='new'?-1:1)*String(a.time).localeCompare(String(b.time)));

function el(tag,props={},...kids){const {dataset,...rest}=props;const e=Object.assign(document.createElement(tag),rest);if(dataset)Object.assign(e.dataset,dataset);e.append(...kids);return e}
const when=(iso)=>iso?new Date(iso):null;
function ago(d){if(!d)return'';const s=(Date.now()-d)/1000;
  if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';
  if(s<86400*7){const n=Math.floor(s/86400);return n+(n===1?' day ago':' days ago')};return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
const full=(d)=>d?d.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
function dayLabel(d){if(!d)return'Undated';const t=new Date();t.setHours(0,0,0,0);const days=Math.round((t-new Date(d).setHours(0,0,0,0))/864e5);
  return days===0?'Today':days===1?'Yesterday':d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}

// The game's details arrive as lines; lines like "Version v0.1.2" become chips, "Key: value" lines a table.
function parseContext(ctx){const chips=[],rows=[],rest=[];
  for(const line of String(ctx||'').split('\n').map(l=>l.trim()).filter(Boolean)){
    const kv=line.match(/^([A-Za-z][\w .\/-]{0,28}):\s*(.+)$/);
    if(kv){rows.push([kv[1],kv[2]]);continue}
    if(/^version\b/i.test(line)||/\bon (macOS|Windows|iPad|iPhone|Android|Linux|iOS)\b/i.test(line)){chips.push(line);continue}
    rest.push(line)}
  return{chips,rows,rest}}

const QUOTE={en:['Re: your feedback on Streets of Prague','Thanks for your message:','Hello,'],cs:['Re: vaše zpětná vazba ke hře Streets of Prague','Děkuji za zprávu:','Dobrý den,']};
function replyParts(m){const t=QUOTE[m.lang]||QUOTE.en;
  return[t[0],t[2]+'\n\n'+t[1]+'\n'+m.message.split('\n').map(l=>'> '+l).join('\n')+'\n\n']}
// A mailto: link does nothing unless the computer has a mail app set as the default, so the button opens Gmail's compose window instead.
function gmailCompose(m){const[subject,body]=replyParts(m);
  return'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(m.email)+'&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function mailto(m){const t=QUOTE[m.lang]||QUOTE.en;
  const body=replyParts(m)[1];
  return'mailto:'+encodeURIComponent(m.email).replace('%40','@')+'?subject='+encodeURIComponent(t[0])+'&body='+encodeURIComponent(body)}

function toast(text,undoFn){clearTimeout(toastTimer);const t=$('toast');t.replaceChildren(text);
  if(undoFn)t.append(el('button',{textContent:'Undo',onclick:()=>{t.hidden=true;undoFn()}}));
  t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,5000)}

async function save(key,patch){
  const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,...patch})});
  if(!r.ok)throw new Error('save');state[key]=(await r.json()).entry}

// Changes a mark, redraws, and moves on to the next message when this one has left the current view.
async function change(m,patch,{say}={}){
  const before=entry(m.key),prev=Object.fromEntries(Object.keys(patch).map(k=>[k,before[k]])),order0=shown().map(x=>x.key);
  setState(m.key,'Saving…');
  try{await save(m.key,patch)}catch{setState(m.key,"Couldn't save. Check that the tool is still running and try again.",true);return false}
  const left=!shown().some(x=>x.key===m.key);
  if(left&&selected===m.key){const i=order0.indexOf(m.key);selected=order0.slice(i+1).concat(order0.slice(0,i)).find(k=>shown().some(x=>x.key===k))||null}
  drawList();if(selected===m.key||left)drawDetail(true);else{paintControls(m);setState(m.key,'Saved')}
  if(say)toast(say,async()=>{try{await change(m,prev)}catch{}});
  return true}
function setState(key,text,bad){const s=$('state');if(s&&selected===key){s.textContent=text;s.className='state'+(bad?' bad':'')}}

function drawTabs(){
  $('tabs').replaceChildren(...TABS.map(([t,l])=>el('button',{className:'tab',type:'button',onclick:()=>{tab=t;pick(null);draw()},ariaPressed:String(t===tab)},
    l,el('span',{className:'n',textContent:messages.filter(m=>inTab(t,m)&&inLang(m)).length}))));
  const langs=[...new Set(messages.map(m=>m.lang||'').filter(Boolean))];
  const sel=$('lang');sel.replaceChildren(el('option',{value:'',textContent:'All languages'}),...langs.map(l=>el('option',{value:l,textContent:LANGS[l]||l.toUpperCase()})));
  sel.value=lang;sel.hidden=langs.length<2}

function drawList(){
  const list=shown(),box=$('list');
  $('count').textContent=list.length===messages.length?messages.length+' messages':list.length+' of '+messages.length;
  drawTabs();
  if(!list.length){const none=!messages.length;
    box.replaceChildren(el('div',{className:'empty'},el('b',{textContent:none?'No messages yet':query||lang||tab!=='attention'?'Nothing matches':'All caught up'}),
      none?'Messages from the feedback form in the game will show up here.':query||lang||tab!=='attention'?'Try another search or filter.':'Every message has been dealt with.'));return}
  const parts=[];let day='';
  for(const m of list){const d=when(m.time),label=dayLabel(d);
    if(label!==day){day=label;parts.push(el('div',{className:'day',textContent:label}))}
    const e=entry(m.key);
    parts.push(el('button',{type:'button',className:'item'+(e.status==='done'||e.status==='wontdo'?' settled':''),ariaCurrent:String(m.key===selected),onclick:()=>{pick(m.key);drawList();drawDetail(true);document.body.classList.add('reading')}},
      el('div',{className:'row'},el('span',{className:'dot',title:STATUS[e.status],dataset:{s:e.status}}),el('span',{className:'who',textContent:m.email||'Anonymous'}),
        ...(m.screenshot?[el('span',{title:'Has a screenshot',textContent:'📷'})]:[]),...(e.replied?[el('span',{className:'tick',title:'Replied',textContent:'✓ replied'})]:[]),
        el('span',{className:'when',textContent:d?d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''})),
      el('div',{className:'text',textContent:m.message})));
    parts[parts.length-1].dataset.key=m.key}
  box.replaceChildren(...parts)}

function pick(key){selected=key}
function paintControls(m){const e=entry(m.key);
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===e.status)));
  const r=$('replied');if(r){r.setAttribute('aria-pressed',String(e.replied));r.querySelector('span').textContent=e.replied?'Replied':'Mark as replied'}}

function drawDetail(reset){
  const box=$('detail'),m=messages.find(x=>x.key===selected);
  if(!m){box.replaceChildren(el('div',{className:'none'},el('div',{},el('b',{textContent:'Pick a message'}),el('br'),el('span',{textContent:'Use ↑ ↓ or j k to move through them.'}))));
    document.body.classList.remove('reading');return}
  const e=entry(m.key),d=when(m.time),{chips,rows,rest}=parseContext(m.context);
  const note=el('textarea',{value:e.note,placeholder:'Private note, for example what you did or what to check',rows:3});
  let timer;const saveNote=()=>{clearTimeout(timer);if(note.value!==entry(m.key).note)change(m,{note:note.value})};
  note.oninput=()=>{setState(m.key,'');clearTimeout(timer);timer=setTimeout(saveNote,1000)};note.onblur=saveNote;
  const seg=el('div',{className:'seg'},...KEYS.map((s,i)=>el('button',{type:'button',ariaPressed:String(s===e.status),onclick:()=>setStatus(m,s)},
    el('span',{className:'dot'}),STATUS[s],el('kbd',{textContent:String(i+1)}))));
  seg.querySelectorAll('.dot').forEach((x,i)=>{x.dataset.s=KEYS[i];seg.children[i].dataset.s=KEYS[i];seg.children[i].style.setProperty('--c','var(--'+KEYS[i]+')')});
  const replied=el('button',{id:'replied',type:'button',className:'btn',ariaPressed:String(e.replied),onclick:()=>change(m,{replied:!entry(m.key).replied})},el('span',{textContent:e.replied?'Replied':'Mark as replied'}),el('kbd',{textContent:'r'}));
  const reply=m.email?el('a',{className:'btn primary',href:gmailCompose(m),target:'_blank',rel:'noopener',textContent:'Reply by email',onclick:()=>{if(!entry(m.key).replied)toast('Opened a new message in Gmail. Mark as replied once you have sent it.')}}):el('span',{className:'btn',ariaDisabled:'true',disabled:true,textContent:'No email address to reply to'});
  const copy=el('button',{type:'button',className:'btn',textContent:'Copy text',onclick:async()=>{try{await navigator.clipboard.writeText(m.message);toast('Copied')}catch{toast("Couldn't copy")}}});
  const details=rows.length||rest.length?el('div',{className:'card'},el('h2',{textContent:'From the game'}),
    ...(rows.length?[el('dl',{},...rows.flatMap(([k,v])=>[el('dt',{textContent:k}),el('dd',{textContent:v})]))]:[]),
    ...(rest.length?[el('details',{open:!rows.length},el('summary',{textContent:'More details'}),el('pre',{textContent:rest.join('\n')}))]:[])):null;
  box.replaceChildren(el('div',{className:'sheet'},
    el('button',{className:'back',type:'button',textContent:'← All messages',onclick:()=>document.body.classList.remove('reading')}),
    el('div',{className:'meta'},el('span',{title:d?d.toISOString():'',textContent:full(d)+(d?' · '+ago(d):'')}),
      m.email?el('a',{href:mailto(m),textContent:m.email}):el('span',{textContent:'No address given'}),
      ...(m.lang?[el('span',{className:'lang',textContent:m.lang.toUpperCase()})]:[])),
    el('div',{className:'message',textContent:m.message}),
    ...(m.screenshot?[picture(m)]:[]),
    ...(chips.length?[el('div',{className:'chips'},...chips.map(c=>el('span',{className:'chip',textContent:c})))]:[]),
    el('div',{className:'card'},el('h2',{textContent:'What happened to this'}),seg,
      el('div',{className:'actions'},reply,replied,copy)),
    el('div',{className:'card'},el('h2',{textContent:'Your note'}),note,el('div',{className:'state',id:'state'})),
    ...(m.scenario?[el('div',{className:'card'},el('h2',{textContent:'Replay this situation'}),el('pre',{className:'scenario',textContent:m.scenario}),
      el('div',{className:'actions'},el('button',{type:'button',className:'btn',textContent:'Copy scenario',onclick:async()=>{try{await navigator.clipboard.writeText(m.scenario);toast('Copied. Paste it into a conversation to see the same spot.')}catch{toast("Couldn't copy")}}})))]:[]),
    ...(details?[details]:[])));
  if(reset)box.scrollTop=0}

// The screenshot the game took when the form was opened; a click shows it full size.
function picture(m){const img=el('img',{className:'shot',alt:'What the player saw in the game',src:'/api/screenshot?key='+encodeURIComponent(m.screenshot),loading:'lazy'});
  const box=el('a',{className:'shotbox',href:img.src,target:'_blank',title:'Open full size'},img);
  img.onerror=()=>box.replaceChildren(el('span',{className:'state bad',textContent:"The screenshot couldn't be loaded."}));return box}

function setStatus(m,s){if(entry(m.key).status===s)return;
  change(m,{status:s},{say:'Marked as '+STATUS[s].toLowerCase()})}

function draw(){drawList();drawDetail(true)}
function step(dir){const list=shown();if(!list.length)return;
  const i=list.findIndex(m=>m.key===selected);pick(list[Math.max(0,Math.min(list.length-1,i<0?(dir>0?0:list.length-1):i+dir))].key);
  drawList();drawDetail(true);document.querySelector('.item[aria-current=true]')?.scrollIntoView({block:'nearest'})}

$('q').oninput=(e)=>{query=e.target.value.toLowerCase().trim();draw()};
$('lang').onchange=(e)=>{lang=e.target.value;draw()};
$('order').onchange=(e)=>{order=e.target.value;draw()};
addEventListener('keydown',(e)=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if(e.key==='Escape'){if(typing)document.activeElement.blur();else document.body.classList.remove('reading');return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  const m=messages.find(x=>x.key===selected);
  if(e.key==='/'){e.preventDefault();$('q').focus()}
  else if(e.key==='j'||e.key==='ArrowDown'){e.preventDefault();step(1)}
  else if(e.key==='k'||e.key==='ArrowUp'){e.preventDefault();step(-1)}
  else if(m&&/^[1-4]$/.test(e.key))setStatus(m,KEYS[e.key-1]);
  else if(m&&e.key==='r')change(m,{replied:!entry(m.key).replied});
});
setInterval(()=>{const m=messages.find(x=>x.key===selected);if(m&&!document.activeElement?.matches('textarea'))drawDetail(false)},60000);

fetch('/api/messages').then(r=>r.json()).then(d=>{messages=d.messages;state=d.state;$('sample').hidden=!d.sample;
  const first=shown()[0];if(first&&matchMedia('(min-width:761px)').matches)selected=first.key;draw()})
 .catch(()=>{$('banner').hidden=false;$('banner').textContent="Couldn't load the messages. Is the tool still running?"});
</script>
