# busybox httpd only knows a few MIME types. Without a Content-Type, Cloudflare
# passes responses through uncompressed, so name the ones the game serves.
.json:application/json
.bin:application/octet-stream
# The tiles' .bin files come gzipped; the game unpacks them itself, so they go as they are.
.gz:application/octet-stream
.svg:image/svg+xml
.wasm:application/wasm
# licenses.txt (the libraries' licences, which the build writes) has a © or two.
.txt:text/plain; charset=utf-8
