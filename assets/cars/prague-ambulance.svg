<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2048" height="1024" viewBox="0 0 1024 512">
  <!-- Rebuild from the repository root:
       rsvg-convert assets/cars/prague-ambulance.svg -o /tmp/ambulance-livery.png
       cwebp -lossless -z 8 /tmp/ambulance-livery.png -o public/ambulance-livery.webp
       The two box sides, rear doors, bonnet stripes and registration plates.
       Each panel is drawn as vinyl seen from outside, so lettering reads on both sides. -->
  <defs>
    <linearGradient id="gold" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffc03a"/><stop offset="1" stop-color="#e5a126"/>
    </linearGradient>
    <pattern id="checks" width="116" height="86" patternUnits="userSpaceOnUse" y="184">
      <rect width="116" height="86" fill="url(#gold)"/>
      <path d="M0 0h58v43H0z M58 43h58v43H58z" fill="#006856"/>
    </pattern>
    <pattern id="edge" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 0h8v8H0z" fill="#c99731"/>
    </pattern>
    <g id="star">
      <path d="M-13-56H13V-23L41-40 55-16 27 0 55 16 41 40 13 23V56H-13V23L-41 40-55 16-27 0-55-16-41-40-13-23Z" fill="#144b91" stroke="#f4f3df" stroke-width="2"/>
      <path d="M0-43V43" stroke="#f7f8eb" stroke-width="3.4" />
      <path d="M8-35C-15-41-17-14 0-6S14 10 1 17-8 28-2 32" fill="none" stroke="#f7f8eb" stroke-width="3.6" stroke-linecap="round"/>
    </g>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4e5142" stop-opacity="0"/><stop offset=".65" stop-color="#736954" stop-opacity=".08"/>
      <stop offset="1" stop-color="#665b46" stop-opacity=".27"/>
    </linearGradient>
    <linearGradient id="reflector" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#434a53"/><stop offset=".3" stop-color="#c4d0d7"/><stop offset=".52" stop-color="#636970"/>
      <stop offset=".65" stop-color="#eeeeec"/><stop offset="1" stop-color="#8c979c"/>
    </linearGradient>
    <radialGradient id="optic" cx=".42" cy=".36" r=".62">
      <stop stop-color="#ffffff"/><stop offset=".16" stop-color="#a8b7c6"/><stop offset=".34" stop-color="#edf0f2"/>
      <stop offset=".56" stop-color="#546374"/><stop offset=".8" stop-color="#bfc5c9"/><stop offset="1" stop-color="#30383f"/>
    </radialGradient>
    <g id="side">
      <rect width="500" height="280" fill="#eee02b"/>
      <path d="M0 148H500V181H0z" fill="#b81f2a"/>
      <path d="M0 185H500V278H0z" fill="url(#checks)"/>
      <rect x="2" y="1" width="496" height="6" fill="url(#edge)"/>
      <rect x="490" y="7" width="8" height="267" fill="url(#edge)"/>
      <use xlink:href="#star" transform="translate(59 133) scale(1.13 1.87)"/>
      <path d="M107 132H153l4-3 4 3h21l5-5 5 5h16l5 8 5-47 5 61 6-23 5 1h16l5-4 7 4h228" fill="none" stroke="#26302d" stroke-linejoin="round" stroke-width="1.5"/>
      <rect y="216" width="500" height="64" fill="url(#sill)"/>
    </g>
    <g id="city">
      <rect x="-23" y="-25" width="46" height="50" rx="1.7" fill="#bd1924" stroke="#f4d749"/>
      <text fill="#ffe04c" font-family="Georgia,serif" font-weight="bold" font-size="9" letter-spacing="0.5">
        <tspan x="-19" y="-12">PRAHA</tspan><tspan x="-19" dy="10">PRAGUE</tspan><tspan x="-19" dy="10">PRAGA</tspan><tspan x="-19" dy="10">PRAG</tspan>
      </text>
    </g>
    <g id="service" fill="#191e1c" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">
      <text font-size="19" textLength="145" lengthAdjust="spacingAndGlyphs" y="0">ZDRAVOTNICKÁ</text>
      <text font-size="20" textLength="109" lengthAdjust="spacingAndGlyphs" y="21">ZÁCHRANNÁ</text>
      <text font-size="22" y="44">SLUŽBA</text>
      <text font-size="8" font-weight="normal" letter-spacing="1" y="56">HL. M. PRAHY</text>
    </g>
    <g id="call" fill="#182627">
      <path d="M1 0h11v21H1z M3-4h2v4H3z"/><path d="M3 4h7v7H3z M3 14h2v2H3z M8 14h2v2H8z M3 18h2v1H3z M8 18h2v1H8z" fill="#eee02b"/>
      <text x="16" y="21" font-family="Arial,sans-serif" font-size="33" font-style="italic" font-weight="bold">155</text>
    </g>
