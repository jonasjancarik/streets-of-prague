  <rect width="1024" height="512" fill="#fff"/>
  <g transform="translate(4 4)">
    <use xlink:href="#side"/><use xlink:href="#service" transform="translate(191 39)"/>
    <use xlink:href="#city" transform="translate(274 159)"/><use xlink:href="#call" transform="translate(410 97)"/>
  </g>
  <g transform="translate(516 4)">
    <use xlink:href="#side" transform="translate(500 0) scale(-1 1)"/>
    <use xlink:href="#service" transform="translate(284 42)"/>
    <use xlink:href="#city" transform="translate(212 159)"/><use xlink:href="#call" transform="translate(28 97)"/>
  </g>
  <g transform="translate(4 292)">
    <rect width="214" height="211" fill="#eee02b"/>
    <path d="M0 119h214v24H0z" fill="#b81f2a"/>
    <path d="M0 147h214v61H0z" fill="url(#checks)"/>
    <use xlink:href="#call" transform="translate(137 102) scale(.73)"/>
    <use xlink:href="#city" transform="translate(61 124) scale(.52)"/>
    <rect x="3" y="1" width="208" height="5" fill="url(#edge)"/>
    <text x="107" y="20" fill="#242725" font-family="Arial,sans-serif" text-anchor="middle" font-size="11" font-weight="bold">ZÁCHRANNÁ SLUŽBA</text>
  </g>
  <g transform="translate(232 300)">
    <rect width="140" height="31" rx="3" fill="#edece8" stroke="#333c40" stroke-width="1.7"/>
    <path d="M2 2h15v27H2z" fill="#174787"/><text x="5" y="24" fill="white" font-family="Arial" font-size="7">CZ</text>
    <text x="21" y="24" font-family="Arial,sans-serif" font-size="24" fill="#12181a" letter-spacing="1">7AZ 5170</text>
  </g>
  <g transform="translate(232 348)">
    <rect width="240" height="37" fill="#f2f2df"/>
    <path d="M-1 0h20l22 37H14z M43 0h23l19 37H61z M91 0h24l12 37h-25z M139 0h24l4 37h-25z M188 0h24l-3 37h-24z M234 0h6v37h-15z" fill="#c92830"/>
  </g>
  <g transform="translate(232 399)" font-family="Arial,sans-serif" font-weight="bold" fill="#202a28">
    <rect width="240" height="60" fill="#eee02b"/>
    <text x="120" y="26" font-size="18" text-anchor="middle">ZDRAVOTNICKÁ</text>
    <text x="120" y="47" font-size="18" text-anchor="middle">ZÁCHRANNÁ SLUŽBA</text>
  </g>
  <g transform="translate(514 307)">
    <rect width="210" height="80" rx="4" fill="url(#reflector)"/>
    <g stroke="#424c54" fill="url(#optic)" stroke-width="2">
      <ellipse cx="52" cy="42" rx="38" ry="32"/><ellipse cx="133" cy="40" rx="30" ry="29"/>
    </g>
    <path d="M5 65Q62 80 164 64M5 69Q62 83 163 70" fill="none" stroke="#e0e6e8" stroke-width="2"/>
    <path d="M176 8h27v51l-28 7z" fill="#ce8e44" stroke="#f7ce8a" stroke-width="2"/>
    <path d="M180 10v52m5-52v51m5-51v49m5-49v48" stroke="#ffe1b1"/>
    <path d="M6 6Q68 1 167 6" stroke="#fff" fill="none" stroke-width="3"/>
  </g>
  <g transform="translate(740 306)">
    <rect width="104" height="85" fill="#e6dc24"/>
    <path d="M23 10h58v25c0 18-9 28-29 41-21-12-29-23-29-41z" fill="#255485" stroke="#ad932c" stroke-width="3"/>
    <path d="M28 20h48v12H28z" fill="#bd2a31"/>
    <text x="52" y="29" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="8" fill="#f4e4af">PRAHA</text>
    <use xlink:href="#star" transform="translate(52 47) scale(.22)"/>
  </g>
  <g transform="translate(740 408)" fill="#232926" font-family="Arial,sans-serif">
    <rect width="200" height="55" fill="#e6dc24"/>
    <text x="4" y="33" font-size="27" font-weight="bold">170</text>
    <text x="63" y="21" font-size="12">ZDRAVOTNICKÁ</text>
    <text x="63" y="37" font-size="12">ZÁCHRANNÁ SLUŽBA</text>
  </g>
</svg>
